[project]
name = "nutricoach-app"
version = "0.1.0"
description = "Nutrition agent, Recipe Lab, and local food vision experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ml-pipeline[vision,text] @ git+https://github.com/oremaz/ml-playground.git@919d8b697b6cfea759e33d1402ddbea89a654855",
    "streamlit==1.52.2",
    "langgraph==1.0.5",
    "langgraph-prebuilt==1.0.5",
    "langchain-openai==1.3.5",
    "langchain-core==1.4.9",
    "langgraph-checkpoint-sqlite==3.0.3",
    "openai==2.46.0",
    "python-dotenv==1.2.1",
    "argon2-cffi==25.1.0",
    "plotly==6.5.0",
    "catboost==1.2.10",
]

[project.optional-dependencies]
research = [
    "jupyter==1.1.1",
    "papermill==2.7.0",
    "matplotlib==3.10.8",
    "wandb==0.28.1",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[project.urls]
Repository = "https://github.com/oremaz/nutricoach"

[tool.uv]
package = false
